{% extends "base.html" %}

{% block title %}Login - SoulSync{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700">
    <h2 class="text-3xl font-bold text-center text-pink-400 mb-6">Welcome Back</h2>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
            <input type="text" name="username" class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-pink-400 text-white" required>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <input type="password" name="password" class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-pink-400 text-white" required>
        </div>

        {% if form.errors %}
            <p class="text-red-500 text-sm">Invalid username or password. Please try again.</p>
        {% endif %}

        <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300 mt-4">
            Login
        </button>
    </form>
    
    <p class="text-center text-gray-400 mt-4">
        Don't have an account? <a href="{% url 'register' %}" class="text-pink-400 hover:underline">Sign up here</a>
    </p>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}My Profile - SoulSync{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10">
    <h2 class="text-3xl font-bold text-white mb-8 border-b border-gray-800 pb-4">Account Dashboard</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left Sidebar: User Card -->
        <div class="md:col-span-1">
            <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700 text-center shadow-xl">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" class="w-32 h-32 rounded-full object-cover border-4 border-pink-500 mx-auto shadow-lg">
                {% else %}
                    <div class="w-32 h-32 rounded-full bg-gray-700 flex items-center justify-center mx-auto text-gray-400 border-4 border-gray-600">
                        No Photo
                    </div>
                {% endif %}
                
                <h3 class="text-xl font-bold text-white mt-4">{{ user.username }}</h3>
                <p class="text-gray-400 text-sm">{{ user.email }}</p>
                
                <!-- Profile Completion Bar -->
                <div class="mt-6 text-left">
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-gray-400">Profile Completion</span>
                        <span class="text-pink-400">75%</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2">
                        <div class="bg-gradient-to-r from-pink-500 to-purple-600 h-2 rounded-full" style="width: 75%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Edit Form -->
        <div class="md:col-span-2">
            <div class="bg-gray-800 rounded-2xl p-8 border border-gray-700 shadow-xl">
                <h3 class="text-xl font-bold text-white mb-6">Edit Details</h3>
                
                <form method="POST" enctype="multipart/form-data" class="space-y-5">
                    {% csrf_token %}
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Profile Photo</label>
                        <input type="file" name="avatar" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-pink-500/10 file:text-pink-400 hover:file:bg-pink-500/20 transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Bio</label>
                        <textarea name="bio" rows="3" class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-white transition">{{ form.bio.value|default:'' }}</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Gender</label>
                            <select name="gender" class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-white transition">
                                <option value="M" {% if form.gender.value == 'M' %}selected{% endif %}>Male</option>
                                <option value="F" {% if form.gender.value == 'F' %}selected{% endif %}>Female</option>
                                <option value="O" {% if form.gender.value == 'O' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Interests</label>
                            <input type="text" name="interests" value="{{ form.interests.value|default:'' }}" placeholder="music, travel, etc." class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-white transition">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition duration-300 mt-4 shadow-lg glow-btn">
                        Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

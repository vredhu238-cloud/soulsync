<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SoulSync{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-nav { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-btn:hover { box-shadow: 0 0 20px rgba(236, 72, 153, 0.6); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

    <nav class="sticky top-0 z-50 glass-nav px-6 py-4 flex justify-between items-center transition-all duration-300">
        <a href="/" class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500">
            SoulSync
        </a>
        
        <div class="flex gap-6 items-center font-medium text-sm">
            <a href="/" class="text-gray-300 hover:text-pink-400 transition">Home</a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'discover' %}" class="text-pink-400 hover:text-pink-300 transition">Discover</a>
                <a href="{% url 'matches_list' %}" class="text-gray-300 hover:text-pink-400 transition">Messages</a> 
                
                <!-- Party Room Button -->
                <a href="{% url 'party_room' %}" class="text-purple-400 hover:text-purple-300 transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
                    Party Room
                </a>

                <a href="{% url 'profile' %}" class="text-gray-300 hover:text-pink-400 transition">Profile</a>
                
                <form action="{% url 'logout' %}" method="post" class="inline ml-4">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white px-4 py-2 rounded-full transition duration-300 border border-red-500/20">
                        Logout
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-gray-300 hover:text-pink-400 transition">Login</a>
                <a href="{% url 'register' %}" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white px-5 py-2 rounded-full transition duration-300 shadow-lg glow-btn">
                    Register
                </a>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full p-6">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-gray-800 mt-12 py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2026 SoulSync. Made with ❤️ for connections.</p>
    </footer>

</body>
</html>

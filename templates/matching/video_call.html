{% extends "base.html" %}

{% block title %}{{ title }} - SoulSync{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto mt-6">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-white">{{ title }}</h2>
        <a href="javascript:history.back()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">Leave Call</a>
    </div>

    <!-- Jitsi Meet Video Player Embed -->
    <div class="w-full h-[75vh] bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-700 relative">
        <iframe 
            src="https://meet.jit.si/{{ room_name }}#config.prejoinPageEnabled=false&config.startWithAudioMuted=true" 
            allow="camera; microphone; fullscreen; display-capture; autoplay" 
            class="w-full h-full border-0 absolute inset-0">
        </iframe>
    </div>
</div>
{% endblock %}
